# 统一入口 Nginx（AI 改造 · 阶段8，讲义03 §8）
# 路径分发：/ → 前端容器；/api /files → Java:8080；/mcp → Java:8080（SSE 特殊配置）

upstream rental_backend {
    server rental-app:8080;
}

server {
    listen 80;
    server_name _;

    # 上传大文件（合同图片/知识库文档）放宽限制
    client_max_body_size 50m;

    # ---------- 前端静态资源 ----------
    location / {
        proxy_pass http://rental-frontend:80;
        proxy_set_header Host $host;
    }

    # ---------- 业务 API ----------
    location /api {
        proxy_pass http://rental_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # AI 流式接口（/api/ai/chat/stream SSE）必须关缓冲，否则逐字输出变成一坨
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ---------- 文件下载（生成的文档/上传的图片）----------
    location /files {
        proxy_pass http://rental_backend;
        proxy_set_header Host $host;
    }

    # ---------- MCP Server（SSE 长连接，讲义03 §8 三要素缺一不可）----------
    location /mcp {
        proxy_pass http://rental_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;            # ★ 最关键：SSE 不能缓冲
        proxy_cache off;
        proxy_read_timeout 3600s;       # 长连接 1 小时不断
        chunked_transfer_encoding on;
    }
}
