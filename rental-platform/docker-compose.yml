# ============================================================
# 租房平台 AI 改造 · 全量部署编排（阶段8，工程方案 §8.5）
# 7 个服务：mysql / redis / elasticsearch / rental-app / python-ai / rental-frontend / nginx
#
# 启动：docker compose up -d --build
# 验收：docker compose ps  → 7 个 Up
# 访问：http://服务器IP/  （nginx 统一入口 :80）
#
# 敏感信息：DEEPSEEK_API_KEY 等从同目录 .env 文件读取（compose 自动加载）
# 内存预算（工程方案 §8.3）：合计约 4GB，宿主机建议 6GB+
# ============================================================

services:
  # ---------- 1. MySQL 业务库 ----------
  mysql:
    image: mysql:8.0
    container_name: rental-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: rental_db
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------- 2. Redis（对话记忆 / Token 计数 / 缓存）----------
  redis:
    image: redis:7-alpine
    container_name: rental-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------- 3. Elasticsearch 8.13.1（BM25 检索）----------
  # ⚠️ 版本与 Java 客户端 elasticsearch-java 8.13.1 严格配套（讲义04 的坑）
  # ⚠️ xpack.security 必须关（否则 401）；内存限 512m 防吃满宿主机
  elasticsearch:
    image: elasticsearch:8.13.1
    container_name: rental-es
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s

  # ---------- 4. Python AI 服务（解析/分片/向量化/FAISS/OCR/CLIP）----------
  python-ai:
    build:
      context: ../rental-ai-service
    container_name: rental-python-ai
    restart: unless-stopped
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
      - HF_HUB_DISABLE_XET=1
    ports:
      - "8000:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface      # 模型缓存持久化（不进镜像）
      - paddle-cache:/root/.paddleocr           # OCR 模型缓存
      - ../rental-ai-service/data:/app/data     # FAISS 索引持久化
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 120s   # 首次要下载模型，放宽

  # ---------- 5. Java 主服务（业务 + Spring AI + ES检索/RRF + MCP Server）----------
  rental-app:
    build:
      context: .
    image: rental-platform:2.0
    container_name: rental-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/rental_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: 123456
      JWT_SECRET: rental-platform-production-secret-key-at-least-32-bytes
      SERVER_PORT: 8080
      FILE_STORAGE_PATH: /app/uploads
      LOG_PATH: /app/logs
      # 容器互访用服务名（讲义01：compose 网络内不用 localhost）
      REDIS_HOST: redis
      ES_URL: http://elasticsearch:9200
      PYTHON_AI_URL: http://python-ai:8000
      HOUSE_IMAGE_ROOT: /app/static
      # 从 .env 注入（fail-fast：缺 key 启动失败 —— 工程方案 §9.2 验收项）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?请在 .env 中配置 DEEPSEEK_API_KEY}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-rental-mcp-prod-token}
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
      - ../rental-project/rental-frontend/public:/app/static:ro   # 房源图片（CLIP 入库读）

  # ---------- 6. 前端（nginx 托管 dist）----------
  rental-frontend:
    build:
      context: ../rental-project/rental-frontend
    container_name: rental-frontend
    restart: unless-stopped
    ports:
      - "5173:80"

  # ---------- 7. Nginx 统一入口（:80 对外）----------
  nginx:
    image: nginx:alpine
    container_name: rental-nginx
    restart: unless-stopped
    depends_on:
      - rental-app
      - rental-frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql-data:
  redis-data:
  es-data:
  hf-cache:
  paddle-cache:
  uploads:
  logs:
