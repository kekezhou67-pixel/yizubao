# ============================================================
# \u751F\u4EA7\u73AF\u5883\uFF08prod\uFF09
#
# \u542F\u52A8\u65B9\u5F0F\uFF08\u4E8C\u9009\u4E00\uFF09\uFF1A
#   1) java -jar app.jar --spring.profiles.active=prod
#   2) SPRING_PROFILES_ACTIVE=prod java -jar app.jar
#
# \u5FC5\u987B\u63D0\u524D\u8BBE\u7F6E\u7684\u73AF\u5883\u53D8\u91CF\uFF08\u7F3A\u4E00\u4E2A\u5C31\u542F\u52A8\u5931\u8D25\uFF0C\u8FD9\u662F\u6545\u610F\u7684\uFF09\uFF1A
#   DB_URL / DB_USERNAME / DB_PASSWORD / JWT_SECRET
# ============================================================

# ---------- \u7AEF\u53E3 ----------
server.port=${SERVER_PORT:80}

# ---------- \u6570\u636E\u5E93 ----------
# \u2605 \u5168\u90E8\u4ECE\u73AF\u5883\u53D8\u91CF\u8BFB\uFF0C\u6CA1\u6709\u9ED8\u8BA4\u503C \u2014\u2014 \u6CA1\u914D\u5C31\u542F\u52A8\u5931\u8D25
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ★ 启动时就建连接池并失败（1 毫秒超时）
# Spring Boot 3 的 Hikari 默认懒初始化：缺少环境变量时启动不报错，
# 直到第一次访问接口才抛 CannotCreateTransactionException —— 这是"带病运行"。
# 设为 1 后，启动阶段就会尝试建连接，缺配置直接启动失败，符合 fail fast 原则。
spring.datasource.hikari.initialization-fail-timeout=1

# ---------- MyBatis\uFF1A\u751F\u4EA7\u4E0D\u6253\u5370 SQL ----------
mybatis.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl

# ---------- \u65E5\u5FD7 ----------
logging.level.root=info
logging.level.com.rental.platform=info
logging.level.org.springframework=warn
logging.level.org.apache.ibatis=warn

# \u65E5\u5FD7\u6587\u4EF6\uFF1A\u6EDA\u52A8\u5207\u5206\uFF0C\u9632\u6B62\u78C1\u76D8\u6253\u6EE1
logging.file.name=${LOG_PATH:./logs}/app.log
logging.logback.rollingpolicy.max-file-size=100MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=10GB

# ---------- \u6587\u4EF6\u5B58\u50A8 ----------
file.storage.path=${FILE_STORAGE_PATH:/app/uploads}
file.download.base-url=${FILE_DOWNLOAD_URL:https://your-domain.com}

# ---------- Redis\uFF08docker-compose \u5185\u7528\u670D\u52A1\u540D redis\uFF1B\u65E0\u9ED8\u8BA4\u503C\uFF0C\u7F3A\u914D\u7F6E\u542F\u52A8\u5931\u8D25 fail-fast\uFF09----------
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=3000ms

# ---------- Python AI \u670D\u52A1\uFF08docker-compose \u670D\u52A1\u540D\uFF09----------
ai.python.base-url=${PYTHON_AI_URL:http://python-ai:8000}

# ---------- Elasticsearch\uFF08docker-compose \u670D\u52A1\u540D\uFF09----------
ai.es.base-url=${ES_URL:http://elasticsearch:9200}

# ---------- \u623F\u6E90\u56FE\u7247\u7269\u7406\u76EE\u5F55\uFF08\u5BB9\u5668\u5185\u8DEF\u5F84\uFF09----------
ai.house-image.root=${HOUSE_IMAGE_ROOT:/app/static}