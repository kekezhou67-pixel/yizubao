# ============================================================
# \u5F00\u53D1\u73AF\u5883\uFF08dev\uFF09
# \u542F\u52A8\u65F6\u4F1A\u5408\u5E76 application.properties \u7684\u516C\u5171\u914D\u7F6E
# \u540C\u540D key \u4EE5\u672C\u6587\u4EF6\u4E3A\u51C6
# ============================================================

# ---------- \u7AEF\u53E3 ----------
# \u7528\u73AF\u5883\u53D8\u91CF\u5360\u4F4D\uFF0C\u65B9\u4FBF\u540C\u65F6\u8DD1\u591A\u4E2A\u5B9E\u4F8B
server.port=${SERVER_PORT:8080}

#---------\u6570\u636E\u5E93------------
spring.datasource.url=jdbc:mysql://localhost:3306/rental_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}

#------------MyBatis:\u5F00\u53D1\u8981\u6253\u5370SQL-------
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ---------- \u65E5\u5FD7\u7EA7\u522B ----------
logging.level.root=info
logging.level.com.rental.platform=debug
logging.level.com.rental.platform.mapper=debug

# ---------- \u6587\u4EF6\u5B58\u50A8 ----------
file.storage.path=${FILE_STORAGE_PATH:${user.home}/rental-platform/files}
file.download.base-url=${FILE_DOWNLOAD_URL:http://localhost:8080}

# ---------- Redis\uFF08\u5F00\u53D1\u73AF\u5883\uFF1AWindows \u672C\u673A E:\redis-5.0.14\uFF0C\u542F\u52A8: redis-server.exe --port 6379\uFF09----------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=3000ms

# ---------- Python AI \u670D\u52A1\uFF08\u5F00\u53D1\u73AF\u5883\uFF1AWindows \u672C\u673A :8000\uFF09----------
ai.python.base-url=${PYTHON_AI_URL:http://localhost:8000}

# ---------- Elasticsearch\uFF08\u5F00\u53D1\u73AF\u5883\uFF1AWindows \u672C\u673A zip \u7248 8.11.0\uFF0CE:\\u676D\u79D1\u9662\u5B66\u4E60\u9879\u76EE\uFF09----------
ai.es.base-url=${ES_URL:http://localhost:9200}

# ---------- \u623F\u6E90\u56FE\u7247\u7269\u7406\u76EE\u5F55\uFF08\u9636\u6BB57B CLIP \u5165\u5E93\u8BFB\u6587\u4EF6\u7528\uFF09----------
# cover_image \u662F /house-images/xx.jpg\uFF0C\u7269\u7406\u6587\u4EF6\u5728\u524D\u7AEF public \u76EE\u5F55
ai.house-image.root=${HOUSE_IMAGE_ROOT:../rental-project/rental-frontend/public}
# ---------- AI 调试日志（排查 PrematureClose 用，排查完可关）----------
logging.level.org.springframework.ai=DEBUG
logging.level.reactor.netty.http.client=DEBUG
