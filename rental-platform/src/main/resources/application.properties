#=====================================================================
#\u516C\u5171\u914D\u7F6E\u2014\u2014\u2014\u2014\u2014\u2014 \u6240\u6709\u73AF\u5883\u90FD\u4E00\u6837\u7684\u4E1C\u897F\u653E\u8FD9\u91CC
#\u73AF\u5883\u76F8\u5173\u7684\u914D\u7F6E\u89C1\u2014\u2014\u2014\u2014\u2014\u2014application\u2014\u2014dev.properties /application-prod.properties
#=====================================================================

#-------\u6307\u5B9A\u9ED8\u8BA4\u6FC0\u6D3B\u54EA\u4E2A\u73AF\u5883-----------
#\u4E0D\u6307\u5B9A\u7684\u65F6\u5019\u7528dev\uFF1B\u751F\u4EA7\u90E8\u7F72\u65F6\u7528--spring\u3002profiles.active=prod\u8986\u76D6
spring.profiles.active=dev

#-------\u5E94\u7528\u4FE1\u606F-------
spring.application.name=rental-platform

#-------\u6570\u636E\u5E93\u9A71\u52A8(\u6240\u6709\u73AF\u5883\u90FD\u662Fmysql)---------------
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#--------MyBatis--------------
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.rental.platform.entity
mybatis.configuration.map-underscore-to-camel-case=true

#-------JWT---------------
jwt.secret=${JWT_SECRET:rental-platform-dev-secret-change-in-production}
jwt.expire=604800000

# ---------- DeepSeek API (LangChain4j) ----------
deepseek.api.key=${DEEPSEEK_API_KEY:}
deepseek.api.url=${DEEPSEEK_API_URL:https://api.deepseek.com/v1}
deepseek.api.model=${DEEPSEEK_API_MODEL:deepseek-chat}
deepseek.api.timeout=${DEEPSEEK_API_TIMEOUT:60}

# ---------- Spring AI (DeepSeek, OpenAI 兼容协议) ----------
# 坑1: base-url 不带 /v1 —— Spring AI 自动拼 /v1/chat/completions
# 坑2: api-key 未配置时给占位值 —— Spring AI 自动配置要求非空，否则启动直接失败
spring.ai.openai.api-key=${DEEPSEEK_API_KEY:sk-not-configured}
spring.ai.openai.base-url=${SPRING_AI_BASE_URL:https://api.deepseek.com}
spring.ai.openai.chat.options.model=${DEEPSEEK_API_MODEL:deepseek-chat}
spring.ai.openai.chat.options.temperature=0.7

# ---------- \u963F\u91CC\u4E91\u77ED\u4FE1 ----------
aliyun.sms.access-key-id=${ALIYUN_SMS_ACCESS_KEY:}
aliyun.sms.access-key-secret=${ALIYUN_SMS_SECRET:}
aliyun.sms.sign-name=${ALIYUN_SMS_SIGN_NAME:hengchuanglianzhong}
aliyun.sms.template-code=${ALIYUN_SMS_TEMPLATE:100001}
aliyun.sms.region=${ALIYUN_SMS_REGION:cn-hangzhou}
aliyun.sms.notification-template=${ALIYUN_SMS_NOTIFICATION_TEMPLATE:SMS_295790002}

# ---------- SpringDoc / Swagger ----------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.packages-to-scan=com.rental.platform.controller

# ---------- MCP Server（阶段8，讲义03 §7）----------
spring.ai.mcp.server.name=rental-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.sse-endpoint=/mcp
spring.ai.mcp.server.sse-message-endpoint=/mcp/message
# MCP 独立 Bearer 鉴权（McpAuthFilter），生产用环境变量覆盖
mcp.auth.token=${MCP_AUTH_TOKEN:rental-mcp-dev-token}